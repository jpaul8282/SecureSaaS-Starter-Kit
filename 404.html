<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found | BillingHub Documentation</title>
  <style>
    :root {
      --bg-color: #0a0f1d;
      --card-bg: #131b2e;
      --border-color: #283654;
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --indigo: #6366f1;
      --cyan: #06b6d4;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-color);
      color: var(--text-primary);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 24px;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      max-width: 520px;
      width: 100%;
      padding: 40px 32px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    }
    .icon-badge {
      width: 64px;
      height: 64px;
      border-radius: 18px;
      background: rgba(99, 102, 241, 0.15);
      color: var(--indigo);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
    }
    h1 {
      font-size: 1.8rem;
      font-weight: 700;
      margin-bottom: 12px;
      background: linear-gradient(135deg, #fff, #cbd5e1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p {
      color: var(--text-secondary);
      line-height: 1.6;
      margin-bottom: 24px;
      font-size: 0.95rem;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 12px 24px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 0.95rem;
      text-decoration: none;
      background: linear-gradient(135deg, var(--indigo), #4f46e5);
      color: #fff;
      transition: opacity 0.2s;
    }
    .btn:hover {
      opacity: 0.9;
    }
  </style>
  <script>
    (function() {
      // Determine base URL for GitHub Pages (handles user.github.io/repo/ vs custom domain)
      var pathSegments = window.location.pathname.split('/').filter(Boolean);
      var isGitHubIo = window.location.hostname.endsWith('github.io');
      var repoBase = (isGitHubIo && pathSegments.length > 0) ? '/' + pathSegments[0] + '/' : '/';

      // Automatically redirect back to the docs home page
      setTimeout(function() {
        var homeBtn = document.getElementById('home-btn');
        var targetUrl = (homeBtn && homeBtn.href && homeBtn.href !== '#' && !homeBtn.href.endsWith('#')) 
          ? homeBtn.href 
          : repoBase + 'docs/';
        window.location.replace(targetUrl);
      }, 1500);

      window.addEventListener('DOMContentLoaded', function() {
        var homeBtn = document.getElementById('home-btn');
        if (homeBtn) {
          homeBtn.href = repoBase + 'docs/';
        }
      });
    })();
  </script>
</head>
<body>
  <div class="card">
    <div class="icon-badge">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
        <circle cx="12" cy="12" r="10"/>
        <line x1="12" y1="8" x2="12" y2="12"/>
        <line x1="12" y1="16" x2="12.01" y2="16"/>
      </svg>
    </div>
    <h1>Documentation Page Not Found</h1>
    <p>The requested route could not be found. Redirecting you automatically back to the BillingHub Documentation Home...</p>
    <a id="home-btn" href="./docs/" class="btn">Return to Documentation Home</a>
  </div>
</body>
</html>
